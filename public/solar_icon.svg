<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0f172a"></rect>

  <!-- Sun rays -->
  <g stroke="#facc15" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="6" x2="32" y2="14"></line>
    <line x1="32" y1="50" x2="32" y2="58"></line>
    <line x1="6" y1="32" x2="14" y2="32"></line>
    <line x1="50" y1="32" x2="58" y2="32"></line>
    <line x1="14" y1="14" x2="20" y2="20"></line>
    <line x1="44" y1="44" x2="50" y2="50"></line>
    <line x1="50" y1="14" x2="44" y2="20"></line>
    <line x1="20" y1="44" x2="14" y2="50"></line>
  </g>

  <!-- Sun -->
  <circle cx="32" cy="28" r="12" fill="#facc15"></circle>

  <!-- Solar panel -->
  <g transform="translate(17 38)">
    <polygon points="0,0 30,0 36,14 5,14" fill="#2563eb"></polygon>
    <line x1="9" y1="0" x2="13" y2="14" stroke="#93c5fd" stroke-width="1.5"></line>
    <line x1="20" y1="0" x2="24" y2="14" stroke="#93c5fd" stroke-width="1.5"></line>
    <line x1="3" y1="7" x2="33" y2="7" stroke="#93c5fd" stroke-width="1.5"></line>
  </g>
</svg>